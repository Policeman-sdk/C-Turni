<?xml version="1.0" encoding="UTF-8"?>
<!-- C-TURNI · sfondo tema «Forestale · giorno» · bg-forestale-light.svg
     Wrapper SVG dell'artwork ad alta risoluzione (bg-forestale-light.png).
     Griglia di riferimento: viewBox 0 0 1440 900 · preserveAspectRatio slice (cover).
     Layer: fallback cromatico → artwork → vignettatura → noise. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" width="1440" height="900"
     role="img" aria-label="Sfondo Forestale · giorno">
  <defs>
    <filter id="nfNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="11" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <radialGradient id="nfVign" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".44"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f4f8f4"/>
  <image href="bg-forestale-light.png" xlink:href="bg-forestale-light.png" x="0" y="0" width="100%" height="100%"
         preserveAspectRatio="xMidYMid slice"/>
  <rect width="100%" height="100%" fill="url(#nfVign)"/>
  <rect width="100%" height="100%" filter="url(#nfNoise)" opacity=".05" style="mix-blend-mode:overlay"/>
</svg>
